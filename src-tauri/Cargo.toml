[package]
name = "vong-quay-may-man"
version = "1.0.0"
description = "Vòng Quay May Mắn - Ứng Dụng Gọi Tên Học Sinh"
authors = ["HongDucDev"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"

# Optimised for a small footprint and fast startup on low-spec classroom PCs.
# The number-crunching is all in the webview, so code size and startup latency
# matter more here than peak throughput.
[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
incremental = false
strip = true
